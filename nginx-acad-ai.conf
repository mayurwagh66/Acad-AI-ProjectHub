# Nginx reverse proxy configuration for Acad-AI alongside Nextcloud
# Location: /etc/nginx/sites-available/acad-ai.conf

server {
    listen 80;
    server_name acad.yourdomain.com; # Replace with your domain / subdomain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name acad.yourdomain.com; # Replace with your domain / subdomain

    # SSL Certs (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/acad.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acad.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow larger file uploads (matches express-fileupload)
    client_max_body_size 100M;

    # Proxy HTTP application requests to Node.js / Docker container on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO WebSockets for real-time notifications/updates
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
